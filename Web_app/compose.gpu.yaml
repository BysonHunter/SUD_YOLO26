# docker compose -f compose.yaml -f compose.gpu.yaml up -d --build
services:
  worker:
    image: sud-yolo26-worker:gpu
    build:
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu128
    environment:
      SUD_DEVICE: '0'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
